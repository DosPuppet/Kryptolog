name: Security

# AppSec gate (audit KRY-008). CI proves the app works; this proves it isn't
# shipping known-vulnerable dependencies, leaked secrets, or code patterns that
# static analysis can catch.
#
# Every action is pinned to an immutable commit SHA rather than a tag, because
# a tag can be repointed at new code by anyone who controls the action repo —
# a real supply-chain risk for a project that stores secrets.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependency advisories land continuously, so re-scan even when the code
    # is untouched. Monday 06:00 UTC.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  python-deps:
    name: python deps (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit locked dependencies
        # Audits the resolved lockfile, so this reflects what production
        # actually installs — not just the floors in requirements.txt.
        run: pip-audit --requirement backend/requirements.lock --strict

      - name: Verify the lockfile matches requirements.txt
        # A stale lock silently reverts the supply-chain guarantee: production
        # would install pinned-but-outdated versions while requirements.txt has
        # moved on. Regenerate and diff to prove they agree.
        run: |
          pip install pip-tools
          cp backend/requirements.lock /tmp/committed.lock
          pip-compile --quiet --generate-hashes \
            --output-file=backend/requirements.lock backend/requirements.txt
          if ! diff -q <(grep -vE '^\s*#' /tmp/committed.lock) \
                       <(grep -vE '^\s*#' backend/requirements.lock) >/dev/null; then
            echo "::error::requirements.lock is out of date. Run:"
            echo "  pip-compile --generate-hashes --output-file=backend/requirements.lock backend/requirements.txt"
            diff <(grep -vE '^\s*#' /tmp/committed.lock) \
                 <(grep -vE '^\s*#' backend/requirements.lock) || true
            exit 1
          fi

  node-deps:
    name: node deps (npm audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, trustkeys, packages/crypto-core]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm audit (${{ matrix.project }})
        # High and critical block; moderate/low are reported but do not fail
        # the build, so a transitive dev-only advisory can't wedge delivery.
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.project }}

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a key committed and later removed is still exposed,
          # so scanning only the tip would miss exactly the cases that matter.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload findings
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: /language:${{ matrix.language }}
