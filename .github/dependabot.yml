# Automated dependency updates (audit KRY-008).
#
# Grouped so a week's patches arrive as one reviewable PR per ecosystem rather
# than a swarm of individual ones — the failure mode with ungrouped Dependabot
# is that nobody reviews any of them.
#
# github-actions is included deliberately: actions are pinned by SHA in the
# workflows, and a SHA pin never updates itself. Dependabot rewrites the pin
# and keeps the `# v4` comment in step, which is what makes SHA pinning
# sustainable rather than a slowly-rotting snapshot.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # requirements.in (floors) -> requirements.txt (hashed lock) is pip-compile's
    # own layout, which Dependabot recognises: it bumps the floor AND regenerates
    # the hashed file in the same PR. The previous floors -> requirements.lock
    # pair was not recognised, so every pip PR left the lock behind, failed the
    # freshness check and could not land unaided (audit 2026-10-12 K-11).
    allow:
      - dependency-type: direct

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /trustkeys
    schedule:
      interval: weekly
    groups:
      extension:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /packages/crypto-core
    schedule:
      interval: weekly
    groups:
      crypto-core:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ["*"]
