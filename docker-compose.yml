# Local infrastructure for the Kryptolog backend:
#   • postgres — the database DATABASE_URL points at.
#     First start also creates the `kryptolog_test` database (init script
#     below); if your volume predates that script, create it once by hand:
#       docker compose --env-file backend/.env exec postgres createdb -U kryptolog kryptolog_test
#   • redis — shared rate-limit storage + WebSocket fan-out/presence
#     (enabled by REDIS_URL, see backend/.env.example). State is transient
#     by design (throttle counters, presence TTL keys) — no volume.
#
# Start with (start_all.sh does this for you):
#   docker compose --env-file backend/.env up -d postgres redis
#
# Two things changed here (audit 2026-10-12 K-01, 2026-09-11 M-2), and both
# matter because this is the file the "recommended" start path runs:
#
#   • Ports are published on 127.0.0.1 ONLY. They were published on every
#     interface, and Docker writes its own iptables rules, so a host firewall
#     such as UFW did not stop them: anyone on the network reached a database
#     whose rows decide which encryption key a contact is served, and a Redis
#     whose pub/sub channel can push frames into any user's WebSocket.
#   • No password lives in this file. Both come from backend/.env, which
#     start_all.sh generates on first run; a missing one stops compose with a
#     message instead of falling back to a well-known default.
#     POSTGRES_PASSWORD only applies when the volume is first created — to
#     rotate it on an existing volume, ALTER ROLE as well (see DEPLOYMENT.md).
#
# `restart: unless-stopped` brings both back after a reboot, provided the
# Docker daemon itself starts at boot (`systemctl enable docker`). Without it
# they stayed down while PM2 resurrected the backend, which failed its
# migration five times and gave up — an install that looked fine until its
# first reboot (found 2026-10-15). serve.sh also waits for the database now,
# which covers the race between the two at boot.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kryptolog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env and run compose with --env-file backend/.env}
      POSTGRES_DB: kryptolog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kryptolog-pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kryptolog -d kryptolog"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      # Read by redis-cli in the healthcheck (REDISCLI_AUTH), so the password
      # is not also spelled out on that command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env and run compose with --env-file backend/.env}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kryptolog-pgdata:
