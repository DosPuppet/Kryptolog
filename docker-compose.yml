# Local infrastructure for the Kryptolog backend:
#   • postgres — matches the default DATABASE_URL in backend/database.py.
#     First start also creates the `kryptolog_test` database (init script
#     below); if your volume predates that script, create it once by hand:
#       docker compose exec postgres createdb -U kryptolog kryptolog_test
#   • redis — shared rate-limit storage + WebSocket fan-out/presence
#     (enabled by REDIS_URL, see backend/.env.example). State is transient
#     by design (throttle counters, presence TTL keys) — no volume.
# Start with:
#   docker compose up -d postgres redis

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kryptolog
      POSTGRES_PASSWORD: kryptolog
      POSTGRES_DB: kryptolog
    ports:
      - "5432:5432"
    volumes:
      - kryptolog-pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kryptolog -d kryptolog"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kryptolog-pgdata:
