# Gitleaks configuration for the secret-scan gate in .github/workflows/security.yml.
#
# The scan runs over full history (fetch-depth: 0), so a finding cannot be retracted
# by editing the working tree — the commit that introduced it stays scannable forever.
# Suppressions therefore live here rather than as `gitleaks:allow` source comments.
#
# Two behaviours of gitleaks 8.24.3 (the version the pinned action installs) shape
# this file, both verified against that binary:
#
#   - The plural `[[allowlists]]` table is silently ignored when extending the default
#     config; only the singular `[allowlist]` below takes effect. A rule written the
#     other way looks correct and suppresses nothing.
#   - `condition = "AND"` is not honoured here — clauses combine as OR, so *any* one
#     of them suppresses the finding on its own. That is why this allowlist carries a
#     `regexes` entry and deliberately no `paths` entry: a path clause would OR in and
#     blind the scanner to every future secret committed to that file.
#
# Keep entries matched to an exact known-public value, never to a location.

[extend]
# Inherit the upstream rule set; this file only subtracts from it.
useDefault = true

[allowlist]
description = """
Golden test vectors, not credentials. Each entry below is either a SHA-256
digest of PUBLIC input, or a patterned test seed and what it derives — in both
cases the data it comes from sits in plaintext in the same fixture — and each is
asserted byte-for-byte by the suites, which is the whole reason it is committed
at all. High entropy, or a key named "secret", is what trips the generic-api-key
rule.

Scoped to the literal values, so a real key committed to those same files is
still caught.
"""
regexes = [
  # sha256("null") — the digest of an ABSENT key envelope in the v1.4.0 message
  # signing body (audit M-8), asserted in
  # packages/crypto-core/test/byte-compat.test.js. The assertion on the next line
  # there recomputes it with createHash, which proves exactly what this claims.
  '''74234e98afe7498fb5daf1f36ac2d78acc339464f950703b8c019892f982b90b''',

  # sha256(canonical_json(message_keys)) — the `keysh` of the PRESENT envelope in
  # the same body, in tests/fixtures/signed_bodies.json. Two hits, one value: the
  # plain and redacted forms (lines 13, 14) commit to the same envelope, which is
  # the 2.1.0 additive-cutover property. What it digests is `message_keys` in that
  # very file — four fields of 3- and 4-byte stand-ins — so recomputing it with
  # backend/auth.py's _canonical_json checks this claim in one line.
  #
  # It cannot be masked or removed instead: the fixture exists so that neither
  # language can be the one that is right about the bytes, and both
  # backend/tests/test_signed_bodies.py and crypto-core's byte-compat suite pin it.
  '''ecbda0b6fa46f4617545cc91738d3c701b16f52c2de63403c15a5bf3de97d9f6''',

  # The same `keysh`, regenerated for crypto-core 3.0.0: every wrapped key in
  # `message_keys` gained `"v": 3` and `"alg": "MLKEM768-HKDF-A256GCM"`, so the
  # digest moved. Same class, same check — recompute it from that file's
  # `message_keys` with backend/auth.py's _canonical_json. The 2.x value above
  # stays: the scan covers history, where it still lives.
  '''060aaf6e6409db5164f3f20e904b0a063d05e472992ddf3ee9f96e6c4d968acc''',

  # tests/fixtures/hybrid_interop.json (lot 11b, crypto-core 4 hybrids), three
  # values the generic-api-key rule flags for the word "secret" in their keys:
  #
  # composite_secret_key — the bytes 00..3f in order, a patterned TEST seed
  # chosen so that it is visibly not a key anyone uses. It is committed because
  # both languages must derive composite_public_key from it byte for byte.
  '''000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f202122232425262728292a2b2c2d2e2f303132333435363738393a3b3c3d3e3f''',
  #
  # noble_xwing_shared_secret / openssl_xwing_shared_secret — what the X-Wing
  # ciphertexts in the same file decapsulate to under its xwing_secret_key
  # (40..5f, another patterned test seed). Anyone can recompute them from the
  # file with backend/tests/xwing_ref.decapsulate, which is what the suites do.
  # `+` is escaped: these are regexes.
  '''qxSMynTH/LrQNh5GOR4IqVdu5AHovjtToduqdvOhdjs=''',
  '''NT2g7HheWcXmCaX6meos3fHCt5SkP3jS\+PF/KQMvmO8=''',

  # crypto-core 4.0.0: the same `keysh`, now SHA-384 over the v4 `message_keys`
  # of tests/fixtures/signed_bodies.json (wrapped keys carry v 4 and the X-Wing
  # alg). Recompute it from that file with backend/auth.py's _canonical_json.
  '''91cebfba64ff669cb9f4eee7181c60a1e24954634731fa653108fb5d18436efb6043b068d6be208c91717c96e44b7f6d''',
  #
  # packages/crypto-core/test/golden-envelopes.json, wrapped.encKey: the
  # patterned test session key (11 repeated) sealed once under the key X-Wing
  # derives for the file's patterned seed (5a repeated) — which the suite
  # unwraps. A ciphertext of public test data, flagged for its entropy.
  '''FoTNffAfJsXZICUY6dSyQ7E81ZXKDOYtc2MvOxviRUdMnh3y1lvhosrDid5fyTwT''',

  # tests/fixtures/etsi_catkdf_vectors.json (lot 12a): ETSI TS 103 744's own
  # known-answer test for HKDFwSHA384_P384_ML-KEM-768 (cid 2221), copied
  # verbatim from the reference implementation (forge.etsi.org 103744_QHKEX,
  # branch kats_v1.2.x, main.c). Published test data, flagged for the word
  # "key" in its field names:
  #
  # mlkem_keygen_seed — FIPS 203 derandomized keygen input d||z, also published
  # in the post-quantum-cryptography KAT set the harness cites; both suites
  # derive the vector's pa2 from it.
  '''89b0c4b23019af3498a27da290892d981dd59fa08993bc05da21e1d72503664cb585d4eb01085111a172a87688d0032e3381a9e9a35fdd6ef2f8aeb3b40eb5ce''',
  #
  # key_material — CatKDF's output for the vector, which both suites recompute
  # from k1, k2, MA, MB, info and label in the same file.
  '''a57206ecf56e0bd26026a92568e5f6363a5f747625168140''',
]
