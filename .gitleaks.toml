# Gitleaks configuration for the secret-scan gate in .github/workflows/security.yml.
#
# The scan runs over full history (fetch-depth: 0), so a finding cannot be retracted
# by editing the working tree — the commit that introduced it stays scannable forever.
# Suppressions therefore live here rather than as `gitleaks:allow` source comments.
#
# Two behaviours of gitleaks 8.24.3 (the version the pinned action installs) shape
# this file, both verified against that binary:
#
#   - The plural `[[allowlists]]` table is silently ignored when extending the default
#     config; only the singular `[allowlist]` below takes effect. A rule written the
#     other way looks correct and suppresses nothing.
#   - `condition = "AND"` is not honoured here — clauses combine as OR, so *any* one
#     of them suppresses the finding on its own. That is why this allowlist carries a
#     `regexes` entry and deliberately no `paths` entry: a path clause would OR in and
#     blind the scanner to every future secret committed to that file.
#
# Keep entries matched to an exact known-public value, never to a location.

[extend]
# Inherit the upstream rule set; this file only subtracts from it.
useDefault = true

[allowlist]
description = """
Golden test vectors, not credentials. Each entry below is a SHA-256 digest of
PUBLIC input — the data the digest is taken over sits in plaintext in the same
fixture — and each is asserted byte-for-byte by the suites, which is the whole
reason it is committed at all. High entropy over a 64-hex constant is what trips
the generic-api-key rule.

Scoped to the literal values, so a real key committed to those same files is
still caught.
"""
regexes = [
  # sha256("null") — the digest of an ABSENT key envelope in the v1.4.0 message
  # signing body (audit M-8), asserted in
  # packages/crypto-core/test/byte-compat.test.js. The assertion on the next line
  # there recomputes it with createHash, which proves exactly what this claims.
  '''74234e98afe7498fb5daf1f36ac2d78acc339464f950703b8c019892f982b90b''',

  # sha256(canonical_json(message_keys)) — the `keysh` of the PRESENT envelope in
  # the same body, in tests/fixtures/signed_bodies.json. Two hits, one value: the
  # plain and redacted forms (lines 13, 14) commit to the same envelope, which is
  # the 2.1.0 additive-cutover property. What it digests is `message_keys` in that
  # very file — four fields of 3- and 4-byte stand-ins — so recomputing it with
  # backend/auth.py's _canonical_json checks this claim in one line.
  #
  # It cannot be masked or removed instead: the fixture exists so that neither
  # language can be the one that is right about the bytes, and both
  # backend/tests/test_signed_bodies.py and crypto-core's byte-compat suite pin it.
  '''ecbda0b6fa46f4617545cc91738d3c701b16f52c2de63403c15a5bf3de97d9f6''',
]
